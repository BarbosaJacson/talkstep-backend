spring.application.name=talkstep-backend

# --- CONFIGURAÇÃO DA CONEXÃO COM AIVEN MYSQL ---
spring.datasource.url=jdbc:mysql://mysql-1a53f616-barbosajacson-3a9f.f.aivencloud.com:24342/db_TalkStep?useSSL=true&sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- SPRING SECURITY OAUTH2 (GOOGLE) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile,openid

# --- JPA / HIBERNATE CONFIGS ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect